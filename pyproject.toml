[project]
name = "specsmith"
version = "0.1.0"
description = "Turns free-form client requirements into validated, structured technical specifications using an LLM."
authors = [
    { name = "Luca Giasson Tedesco", email = "lgtedesco@ucs.br" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs prints the reason for each skipped test (e.g. PostgreSQL not running).
addopts = "-rs"
