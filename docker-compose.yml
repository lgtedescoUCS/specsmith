services:
  db:
    image: postgres:16
    environment:
      # Local development credentials only; they match .env.example.
      POSTGRES_USER: specsmith
      POSTGRES_PASSWORD: specsmith
      POSTGRES_DB: specsmith
    ports:
      # Host port 5433 avoids clashing with a native PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U specsmith -d specsmith"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
